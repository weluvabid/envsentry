[workspace]
members = [
    "crates/envsentry-core",
    "crates/envsentry-parsers",
    "crates/envsentry-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15.7"
serde = "1"
serde_json = "1"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
